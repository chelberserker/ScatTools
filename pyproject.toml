[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scatter-analysis"
version = "0.0.1"
description = "Tools for X-ray and neutron scattering analysis"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Author" },
]
dependencies = [
    "numpy",
    "matplotlib",
    "h5py",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/user/scatter-analysis"

[tool.hatch.build.targets.wheel]
packages = ["src/gid", "src/sas"]
