[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ScatTools"
version = "0.0.2"
description = "Tools for X-ray and neutron scattering analysis"
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["version"]
authors = [
  { name="Egor A. Bersenev", email="egor.bersenev@esrf.fr" },
]
dependencies = [
    "numpy",
    "matplotlib",
    "h5py",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/chelberserker/ScatTools/"

[tool.setuptools]
package-dir = {"" = "src"}
